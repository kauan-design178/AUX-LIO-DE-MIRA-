<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel VIP - Free Fire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Fundo roxo neon marcante com degradê */
            background: radial-gradient(circle, #25003f 0%, #0c0014 100%);
            color: white;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Container principal */
        .menu-container {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        /* Painel de Funções com borda roxa brilhante */
        .hack-panel {
            background-color: rgba(30, 0, 50, 0.8);
            border: 1px solid #7b2cbf;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(123, 44, 191, 0.3);
        }

        .panel-title {
            font-size: 14px;
            color: #d800ff; /* Título em rosa/roxo neon brilhante */
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 0 0 5px #d800ff;
        }

        /* Alinhamento dos switches */
        .switch-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .switch-group:last-child {
            margin-bottom: 0;
        }

        .switch-label {
            font-size: 14px;
            font-weight: bold;
            color: #e0e0e0;
        }

        /* Estilização do Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        /* Cor ativa do switch */
        input:checked + .slider {
            background-color: #d800ff;
            box-shadow: 0 0 8px #d800ff;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Estilização dos Botões */
        h2 {
            font-size: 22px;
            margin-top: 10px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(216, 0, 255, 0.5);
        }

        p {
            font-size: 13px;
            color: #bbb;
            margin-bottom: 20px;
        }

        /* Input de Senha */
        .pass-input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background-color: rgba(30, 0, 50, 0.8);
            border: 2px solid #7b2cbf;
            border-radius: 8px;
            color: white;
            text-align: center;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .pass-input:focus {
            border-color: #d800ff;
            box-shadow: 0 0 10px #d800ff;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #7b2cbf; 
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-sizing: border-box;
            box-shadow: 0 0 5px rgba(123, 44, 191, 0.5);
        }

        .btn:hover {
            background-color: #9d4edd;
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.8);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-max {
            background-color: #5a189a;
            box-shadow: 0 0 5px rgba(90, 24, 154, 0.5);
        }

        .btn-max:hover {
            background-color: #7b2cbf;
            box-shadow: 0 0 12px rgba(123, 44, 191, 0.8);
        }

        /* Mensagem de Erro */
        .error-message {
            color: #ff0055;
            font-size: 13px;
            font-weight: bold;
            margin-top: -5px;
            margin-bottom: 15px;
            display: none;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
        }

        /* Estilo da assinatura */
        .credits {
            margin-top: 35px;
            font-size: 12px;
            color: #9d4edd;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(157, 78, 221, 0.6);
            text-transform: lowercase;
        }
    </style>
</head>
<body>

    <!-- 1. TELA DE SENHA (LOGIN) -->
    <div id="login-screen" class="menu-container">
        <h2>Acesso VIP</h2>
        <p>Insira a credencial para liberar o painel:</p>
        
        <input type="password" id="password-field" class="pass-input" placeholder="Digite a senha...">
        <div id="error-msg" class="error-message">Senha incorreta! Tente novamente.</div>
        
        <button class="btn" onclick="verifyPassword()">Entrar no Painel</button>
        
        <div class="credits">dono:@kauan_henrique_oficial</div>
    </div>


    <!-- 2. PAINEL DO JOGO (INICIALMENTE OCULTO) -->
    <div id="main-panel" class="menu-container" style="display: none;">
        
        <!-- PAINEL DE FUNÇÕES (TOPO) -->
        <div class="hack-panel">
            <div class="panel-title">Configurações de Auxílio</div>
            
            <!-- Aim Bot -->
            <div class="switch-group">
                <span class="switch-label">Aim Bot</span>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- No Recoil -->
            <div class="switch-group">
                <span class="switch-label">No Recoil</span>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Anti Ban -->
            <div class="switch-group">
                <span class="switch-label">Anti Ban</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- SEÇÃO DE INICIAR O JOGO -->
        <h2>Iniciar Free Fire</h2>
        <p>Altere as funções acima e abra o jogo diretamente por aqui:</p>

        <a href="freefire://" class="btn">FF NORMAL</a>
        <a href="freefiremax://" class="btn btn-max">FF MAX</a>

        <!-- CRÉDITOS -->
        <div class="credits">dono:@kauan_henrique_oficial</div>

    </div>

    <script>
        // Função para verificar a senha
        function verifyPassword() {
            const passwordInput = document.getElementById('password-field').value;
            const errorMsg = document.getElementById('error-msg');
            
            // ---> COLOQUE A SUA SENHA PREFERIDA AQUI: <---
            const senhaCorreta = "KAUAN-KEY-123"; 

            if (passwordInput === senhaCorreta) {
                // Esconde a tela de login e mostra o painel principal
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
            } else {
                // Mostra mensagem de erro se errar
                errorMsg.style.display = 'block';
                document.getElementById('password-field').value = ''; // Limpa o campo
            }
        }

        // Permite entrar apertando a tecla "Enter" no teclado
        document.getElementById('password-field').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        });
    </script>
</body>
</html>
